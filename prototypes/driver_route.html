<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Motion Conductor - En Ruta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        electric: '#0F172A',
                        neon: '#F59E0B',
                        success: '#10B981',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F172A;
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.5)),
                url('https://upload.wikimedia.org/wikipedia/commons/e/ec/Mapbox_Streets_Geography_Class.png');
            background-size: cover;
            background-position: center bottom;
            color: white;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .route-line {
            width: 4px;
            background: #F59E0B;
            height: 300px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(15deg);
            z-index: 1;
        }

        /* Floating HUD */
        .hud-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <!-- Top HUD: Navigation Instruction -->
    <div class="fixed top-4 left-4 right-4 hud-panel p-4 rounded-xl flex items-center z-50">
        <div class="bg-neon w-12 h-12 rounded-lg flex items-center justify-center mr-4 shadow-lg shadow-orange-500/20">
            <i class="fa-solid fa-arrow-turn-right text-black text-2xl"></i>
        </div>
        <div>
            <h2 class="font-heading text-xl font-bold">Gira a la derecha</h2>
            <p class="text-gray-300">en 150 metros, Av. Principal</p>
        </div>
    </div>

    <!-- Map Elements -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-16 h-16 bg-blue-500/30 rounded-full animate-ping absolute"></div>
        <i class="fa-solid fa-location-arrow text-blue-500 text-4xl z-10 drop-shadow-lg transform -rotate-45"></i>
    </div>

    <!-- Bottom HUD: Trip Info -->
    <div class="hud-panel fixed bottom-0 w-full rounded-t-3xl p-6 z-50">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Maria"
                    class="w-12 h-12 rounded-full border-2 border-white/20 mr-3">
                <div>
                    <h3 class="font-bold text-lg">Recogiendo a María</h3>
                    <div class="flex items-center text-xs text-gray-400">
                        <i class="fa-solid fa-star text-yellow-400 mr-1"></i> 4.9 • Efectivo
                    </div>
                </div>
            </div>
            <div class="text-right">
                <span class="block text-2xl font-heading font-bold text-green-400">$12.500</span>
                <span class="text-xs text-gray-400">4.2 km • 12 min</span>
            </div>
        </div>

        <!-- Action Slider -->
        <button
            class="w-full bg-success hover:bg-green-500 text-black font-bold py-4 rounded-xl shadow-lg shadow-green-500/20 transition transform active:scale-95 flex items-center justify-center">
            <i class="fa-solid fa-user-check mr-2"></i> Confirmar Llegada
        </button>
    </div>

</body>

</html>
