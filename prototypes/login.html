<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Motion Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        electric: '#0F172A',
                        neon: '#8B5CF6',
                        cyber: '#3B82F6',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F172A;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            position: relative;
        }

        .input-underline {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #3B82F6, #8B5CF6);
            transition: width 0.3s ease;
        }

        input:focus ~ .input-underline {
            width: 100%;
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .orb-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            animation: pulse-glow 3s infinite;
        }

        .orb-btn:hover {
            transform: scale(1.1);
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.8), 0 0 10px rgba(139, 92, 246, 0.4) inset; }
            100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); }
        }

        .tiktok-gradient { background: linear-gradient(45deg, #000000, #25F4EE, #FE2C55); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="glass-card w-full max-w-md p-8 rounded-3xl relative overflow-hidden z-10 m-4">
        
        <!-- Decoration -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyber/20 rounded-full blur-2xl"></div>

        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="font-heading text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-2">
                Hola de nuevo
            </h1>
            <p class="text-gray-400 font-sans text-sm">Tu viaje comienza aquí.</p>
        </div>

        <!-- Inputs -->
        <div class="space-y-6 mb-10">
            <div class="input-group">
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-1">Número de Teléfono</label>
                <div class="flex items-center bg-white/5 rounded-lg p-3 border border-white/5 focus-within:border-white/10 transition">
                    <span class="text-gray-400 mr-3 text-lg">🇨🇴</span>
                    <input type="tel" placeholder="+57 300 000 0000" class="bg-transparent border-none outline-none text-white w-full font-sans text-lg placeholder-gray-600">
                </div>
                <div class="input-underline"></div>
            </div>
        </div>

        <!-- Social Login -->
        <div class="mb-8">
            <div class="flex items-center justify-between mb-6">
                <div class="h-px bg-white/10 flex-1"></div>
                <span class="text-xs text-gray-500 px-4 uppercase">O continúa con</span>
                <div class="h-px bg-white/10 flex-1"></div>
            </div>

            <div class="flex justify-center gap-4">
                <!-- TikTok -->
                <button class="social-btn w-12 h-12 rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-tiktok text-white text-xl"></i>
                </button>
                <!-- Facebook -->
                <button class="social-btn w-12 h-12 rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-facebook-f text-blue-500 text-xl"></i>
                </button>
                <!-- Instagram -->
                <button class="social-btn w-12 h-12 rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-instagram text-pink-500 text-xl"></i>
                </button>
                <!-- Kwai (Using Video icon as placeholder/custom) -->
                <button class="social-btn w-12 h-12 rounded-full flex items-center justify-center text-orange-400 font-bold">
                    K
                </button>
                <!-- Google -->
                <button class="social-btn w-12 h-12 rounded-full flex items-center justify-center">
                    <i class="fa-brands fa-google text-white text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Terms -->
        <div class="text-center">
            <p class="text-[10px] text-gray-500">
                Al continuar, aceptas nuestros <a href="#" class="text-blue-400 hover:text-blue-300">Términos</a> y <a href="#" class="text-blue-400 hover:text-blue-300">Política de Privacidad</a>.
            </p>
        </div>
    </div>

    <!-- Voice Assistant Orb -->
    <div class="orb-btn" title="Asistente de Voz">
        <i class="fa-solid fa-microphone text-white text-xl"></i>
    </div>

</body>
</html>
