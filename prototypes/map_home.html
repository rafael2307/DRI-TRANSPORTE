<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo-Motion Pasajero - Mapa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        electric: '#0F172A',
                        neon: '#8B5CF6',
                        cyber: '#3B82F6',
                        glass: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0F172A;
            /* Simulated Dark Map Background */
            background-image:
                linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.8)),
                url('https://upload.wikimedia.org/wikipedia/commons/e/ec/Mapbox_Streets_Geography_Class.png');
            background-size: cover;
            background-position: center;
            color: white;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Simulated Map Elements */
        .map-marker {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: #3B82F6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.8);
            z-index: 10;
        }

        .map-pulse {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            animation: pulse 2s infinite;
            z-index: 5;
        }

        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        /* Car Icon */
        .car-icon {
            position: absolute;
            font-size: 1.2rem;
            color: #fbbf24;
            /* Amber for Taxi/Car */
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.6);
            transition: all 2s ease-in-out;
        }

        /* Glass Panels */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top-bar {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
        }

        /* Floating Orb */
        .orb-btn {
            position: fixed;
            bottom: 240px;
            /* Above the bottom sheet */
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a78bfa, #7c3aed);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 50;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="top-bar fixed top-0 w-full p-4 flex justify-between items-center z-50">
        <div class="w-10 h-10 rounded-full bg-slate-700 overflow-hidden border-2 border-white/20">
            <!-- User Avatar Placeholder -->
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User">
        </div>
        <div class="bg-black/40 backdrop-blur-md px-4 py-1 rounded-full border border-white/10">
            <span class="text-xs font-bold text-green-400">● En línea</span>
        </div>
        <button class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center backdrop-blur-md">
            <i class="fa-solid fa-bell text-white"></i>
        </button>
    </div>

    <!-- Map Content -->
    <div class="map-pulse"></div>
    <div class="map-marker"></div> <!-- User Location -->

    <!-- Simulated Nearby Cars -->
    <i class="fa-solid fa-car-side car-icon" style="top: 30%; left: 40%; transform: rotate(45deg);"></i>
    <i class="fa-solid fa-car-side car-icon" style="top: 50%; left: 70%; transform: rotate(-15deg);"></i>
    <i class="fa-solid fa-car-side car-icon" style="top: 20%; left: 60%; transform: rotate(90deg);"></i>

    <!-- Voice Assistant Orb -->
    <div class="orb-btn transition hover:scale-110">
        <i class="fa-solid fa-microphone text-white text-lg"></i>
    </div>

    <!-- Bottom Sheet (Destination Selection) -->
    <div class="glass-panel fixed bottom-0 w-full rounded-t-3xl p-6 z-40">
        <div class="w-12 h-1 bg-white/20 rounded-full mx-auto mb-6"></div>

        <h2 class="font-heading text-xl font-bold mb-4">¿A dónde vas?</h2>

        <!-- Search Input -->
        <div
            class="bg-white/5 border border-white/10 rounded-xl p-4 flex items-center mb-4 cursor-pointer hover:bg-white/10 transition">
            <i class="fa-solid fa-magnifying-glass text-cyber mr-3"></i>
            <span class="text-gray-400 font-sans">Buscar destino...</span>
        </div>

        <!-- Recent Places -->
        <div class="space-y-3">
            <div class="flex items-center p-3 hover:bg-white/5 rounded-lg transition cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center mr-3">
                    <i class="fa-solid fa-house text-gray-300"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Casa</h3>
                    <p class="text-xs text-gray-400">Calle 123 #45-67</p>
                </div>
            </div>

            <div class="flex items-center p-3 hover:bg-white/5 rounded-lg transition cursor-pointer">
                <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center mr-3">
                    <i class="fa-solid fa-briefcase text-gray-300"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Oficina</h3>
                    <p class="text-xs text-gray-400">Centro Empresarial Torre B</p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
